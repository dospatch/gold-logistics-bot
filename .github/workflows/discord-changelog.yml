name: BC Gold Logistics Discord changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/discord-changelog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Publish company update to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          guild_id = os.environ.get("DISCORD_GUILD_ID", "").strip()
          if not token or not guild_id:
              raise SystemExit("Add DISCORD_BOT_TOKEN and DISCORD_GUILD_ID under GitHub Settings > Secrets and variables > Actions.")

          base = "https://discord.com/api/v10"
          headers = {"Authorization": f"Bot {token}", "Content-Type": "application/json", "User-Agent": "BC-Gold-Logistics-Changelog/1.0"}

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"Discord API {method} {path} returned HTTP {error.code}: {detail[:600]}") from None

          guild_path = f"/guilds/{guild_id}"
          channels = api("GET", guild_path + "/channels")
          channel = next((c for c in channels if c.get("type") == 0 and c.get("name") == "bc-logistics-changelog"), None)
          if channel is None:
              channel = api("POST", guild_path + "/channels", {
                  "name": "bc-logistics-changelog", "type": 0,
                  "topic": "Automatic release notes for BC Gold Logistics website, company systems, features, fixes, and integrations.",
                  "permission_overwrites": [],
              })
              print("Created #bc-logistics-changelog.")

          roles = api("GET", guild_path + "/roles")
          role = next((r for r in roles if r.get("name", "").casefold() == "bc logistics changelog"), None)
          if role is None:
              role = api("POST", guild_path + "/roles", {
                  "name": "BC Logistics Changelog", "color": 0xD7B34A,
                  "hoist": False, "mentionable": True, "permissions": "0",
              })
              print("Created @BC Logistics Changelog role.")

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          ref = os.environ.get("GITHUB_REF_NAME", "main")
          commit_url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/commit/{sha}"
          event_name = os.environ.get("GITHUB_EVENT_NAME", "push")
          title = "Website / company systems update" if event_name == "push" else "Company update"
          commit_message = os.environ.get("GITHUB_COMMIT_MESSAGE", "Company update")
          content = "\\n".join([
              f"<@&{role['id']}>",
              f"## 🏆 BC GOLD LOGISTICS — {title}",
              f"**Update:** {commit_message[:250]}",
              f"**Branch:** `{ref}`",
              f"**Commit:** [`{sha[:7]}`]({commit_url})",
              f"**Repository:** `{repo}`",
              "An update has been merged into the main company project.",
              f"🔗 {commit_url}",
          ])
          api("POST", f"/channels/{channel['id']}/messages", {
              "content": content[:1900],
              "allowed_mentions": {"parse": [], "roles": [role["id"]]},
          })
          print("Published update and role mention to #bc-logistics-changelog.")
          PY
