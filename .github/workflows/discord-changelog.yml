name: BC Gold Logistics Discord changelog
# Rebuild the complete Discord archive as gold embeds on this commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish detailed company changelog to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          guild_id = os.environ.get("DISCORD_GUILD_ID", "").strip()
          if not token or not guild_id:
              raise SystemExit("Missing DISCORD_BOT_TOKEN or DISCORD_GUILD_ID repository secret.")

          base = "https://discord.com/api/v10"
          headers = {
              "Authorization": f"Bot {token}",
              "Content-Type": "application/json",
              "User-Agent": "BC-Gold-Logistics-Changelog/2.0",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as error:
                      detail = error.read().decode("utf-8", errors="replace")
                      if error.code == 429 and attempt < 5:
                          try:
                              wait = float(json.loads(detail).get("retry_after", 1))
                          except (ValueError, TypeError):
                              wait = 1
                          time.sleep(max(wait, 1) + 0.25)
                          continue
                      raise RuntimeError(
                          f"Discord API {method} {path} returned HTTP {error.code}: {detail[:600]}"
                      ) from None

          guild_path = f"/guilds/{guild_id}"
          channels = api("GET", guild_path + "/channels")
          channel = next(
              (item for item in channels if item.get("type") == 0 and item.get("name") == "bc-logistics-changelog"),
              None,
          )
          if channel is None:
              channel = api("POST", guild_path + "/channels", {
                  "name": "bc-logistics-changelog",
                  "type": 0,
                  "topic": "Automatic dated release notes for BC Gold Logistics website, company systems, features, fixes, and integrations.",
                  "permission_overwrites": [],
              })
              print("Created #bc-logistics-changelog.")

          roles = api("GET", guild_path + "/roles")
          role = next(
              (item for item in roles if item.get("name", "").casefold() == "bc logistics changelog"),
              None,
          )
          if role is None:
              role = api("POST", guild_path + "/roles", {
                  "name": "BC Logistics Changelog",
                  "color": 0xD7B34A,
                  "hoist": False,
                  "mentionable": True,
                  "permissions": "0",
              })
              print("Created @BC Logistics Changelog role.")

          after = os.environ["GITHUB_SHA"]
          # Rebuild the complete archive on every deployment so the single post
          # always contains every dated commit, oldest to newest.
          revision_range = after

          log_format = "%cs%x1f%s"
          raw_log = subprocess.check_output(
              ["git", "log", "--reverse", "--format=" + log_format, revision_range],
              text=True,
          ).strip()

          entries = []
          for record in raw_log.splitlines():
              if not record:
                  continue
              date, subject = record.split("\x1f", 1)
              subject = " ".join(subject.split())
              entries.append(f"{date} — {subject}")

          if not entries:
              entries = [f"Update — Company changes published in commit {after[:7]}"]

          heading = "🏆 BC GOLD LOGISTICS — OFFICIAL CHANGELOG"

          # Keep exactly one bot-owned master changelog post. Edit it on every
          # deployment instead of creating a separate message for each push.
          max_description = 3900
          description = "\n".join(entries)
          if len(description) > max_description:
              kept_count = len(entries) - 1
              while kept_count > 0:
                  left_count = (kept_count + 1) // 2
                  right_count = kept_count // 2
                  first = entries[:left_count]
                  last = entries[len(entries) - right_count:] if right_count else []
                  omitted_count = len(entries) - len(first) - len(last)
                  candidate = "\n".join(first + [f"… {omitted_count} middle entries omitted to fit Discord's single-post limit …"] + last)
                  if len(candidate) <= max_description:
                      description = candidate
                      break
                  kept_count -= 1
              if len(description) > max_description:
                  description = entries[-1][:max_description]

          embed = {
              "title": heading,
              "description": description,
              "color": 0xD7B34A,
              "footer": {
                  "text": f"Official company updates • {len(entries)} dated entries • Oldest to newest"
              },
          }
          payload = {
              "content": f"<@&{role['id']}>",
              "embeds": [embed],
              "allowed_mentions": {"parse": [], "roles": [role["id"]]},
          }

          bot_user = api("GET", "/users/@me")
          messages = api("GET", f"/channels/{channel['id']}/messages?limit=100")
          owned_posts = [
              message for message in messages
              if message.get("author", {}).get("id") == bot_user["id"]
              and any(
                  item.get("title") == heading
                  for item in message.get("embeds", [])
              )
          ]

          if owned_posts:
              # Keep the oldest master post so its location in the channel stays stable.
              master = min(owned_posts, key=lambda item: int(item["id"]))
              api("PATCH", f"/channels/{channel['id']}/messages/{master['id']}", payload)
              for duplicate in owned_posts:
                  if duplicate["id"] != master["id"]:
                      api("DELETE", f"/channels/{channel['id']}/messages/{duplicate['id']}")
              print(f"Updated the existing master changelog post ({master['id']}); removed {len(owned_posts) - 1} duplicate bot posts.")
          else:
              master = api("POST", f"/channels/{channel['id']}/messages", payload)
              print(f"Created the single master changelog post ({master['id']}).")

          print(
              f"Master changelog contains {len(entries)} dated commit entries, oldest to newest. "
              f"Role mention appears once in the master post: {role['name']}."
          )
          PY
