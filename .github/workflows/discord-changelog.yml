name: BC Gold Logistics Discord changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/discord-changelog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish detailed company changelog to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          guild_id = os.environ.get("DISCORD_GUILD_ID", "").strip()
          if not token or not guild_id:
              raise SystemExit("Missing DISCORD_BOT_TOKEN or DISCORD_GUILD_ID repository secret.")

          base = "https://discord.com/api/v10"
          headers = {
              "Authorization": f"Bot {token}",
              "Content-Type": "application/json",
              "User-Agent": "BC-Gold-Logistics-Changelog/2.0",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Discord API {method} {path} returned HTTP {error.code}: {detail[:600]}"
                  ) from None

          guild_path = f"/guilds/{guild_id}"
          channels = api("GET", guild_path + "/channels")
          channel = next(
              (item for item in channels if item.get("type") == 0 and item.get("name") == "bc-logistics-changelog"),
              None,
          )
          if channel is None:
              channel = api("POST", guild_path + "/channels", {
                  "name": "bc-logistics-changelog",
                  "type": 0,
                  "topic": "Automatic dated release notes for BC Gold Logistics website, company systems, features, fixes, and integrations.",
                  "permission_overwrites": [],
              })
              print("Created #bc-logistics-changelog.")

          roles = api("GET", guild_path + "/roles")
          role = next(
              (item for item in roles if item.get("name", "").casefold() == "bc logistics changelog"),
              None,
          )
          if role is None:
              role = api("POST", guild_path + "/roles", {
                  "name": "BC Logistics Changelog",
                  "color": 0xD7B34A,
                  "hoist": False,
                  "mentionable": True,
                  "permissions": "0",
              })
              print("Created @BC Logistics Changelog role.")

          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          after = os.environ["GITHUB_SHA"]
          zero_sha = "0" * 40
          if before and before != zero_sha and os.environ.get("GITHUB_EVENT_NAME") == "push":
              revision_range = f"{before}..{after}"
          else:
              revision_range = after

          log_format = "%cs%x1f%s"
          raw_log = subprocess.check_output(
              ["git", "log", "--format=" + log_format, revision_range],
              text=True,
          ).strip()

          entries = []
          for record in raw_log.splitlines():
              if not record:
                  continue
              date, subject = record.split("\x1f", 1)
              subject = " ".join(subject.split())
              entries.append(f"- **{date}** — {subject}")

          if not entries:
              entries = [f"- **Update** — Company changes published in commit {after[:7]}"]

          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ.get("GITHUB_REF_NAME", "main")
          heading = "## 🏆 BC GOLD LOGISTICS CHANGELOG"
          footer = f"Repository: `{repo}` · Branch: `{ref}`"
          role_mention = f"<@&{role['id']}>"

          # Discord message content is limited to 2,000 characters. Split long histories
          # into numbered continuation messages while keeping each commit on one line.
          max_length = 1850
          chunks = []
          current = []
          for entry in entries:
              candidate = "\n".join(current + [entry])
              if current and len(candidate) > 1450:
                  chunks.append(current)
                  current = [entry]
              else:
                  current.append(entry)
          if current:
              chunks.append(current)

          total = len(chunks)
          for index, chunk in enumerate(chunks, start=1):
              part = f" — continued ({index}/{total})" if total > 1 else ""
              prefix = f"{role_mention}\n{heading}{part}\n"
              suffix = f"\n\n{footer}"
              message = prefix + "\n".join(chunk) + suffix
              if len(message) > max_length:
                  raise RuntimeError("A changelog message exceeded the safe Discord message length.")
              api("POST", f"/channels/{channel['id']}/messages", {
                  "content": message,
                  "allowed_mentions": {"parse": [], "roles": [role["id"]]},
              })

          print(f"Published {len(entries)} dated commit entries in {total} Discord message(s).")
          PY
