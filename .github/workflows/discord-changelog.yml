name: BC Gold Logistics Discord changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish detailed company changelog to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          guild_id = os.environ.get("DISCORD_GUILD_ID", "").strip()
          if not token or not guild_id:
              raise SystemExit("Missing DISCORD_BOT_TOKEN or DISCORD_GUILD_ID repository secret.")

          base = "https://discord.com/api/v10"
          headers = {
              "Authorization": f"Bot {token}",
              "Content-Type": "application/json",
              "User-Agent": "BC-Gold-Logistics-Changelog/2.0",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as error:
                      detail = error.read().decode("utf-8", errors="replace")
                      if error.code == 429 and attempt < 5:
                          try:
                              wait = float(json.loads(detail).get("retry_after", 1))
                          except (ValueError, TypeError):
                              wait = 1
                          time.sleep(max(wait, 1) + 0.25)
                          continue
                      raise RuntimeError(
                          f"Discord API {method} {path} returned HTTP {error.code}: {detail[:600]}"
                      ) from None

          guild_path = f"/guilds/{guild_id}"
          channels = api("GET", guild_path + "/channels")
          channel = next(
              (item for item in channels if item.get("type") == 0 and item.get("name") == "bc-logistics-changelog"),
              None,
          )
          if channel is None:
              channel = api("POST", guild_path + "/channels", {
                  "name": "bc-logistics-changelog",
                  "type": 0,
                  "topic": "Automatic dated release notes for BC Gold Logistics website, company systems, features, fixes, and integrations.",
                  "permission_overwrites": [],
              })
              print("Created #bc-logistics-changelog.")

          roles = api("GET", guild_path + "/roles")
          role = next(
              (item for item in roles if item.get("name", "").casefold() == "bc logistics changelog"),
              None,
          )
          if role is None:
              role = api("POST", guild_path + "/roles", {
                  "name": "BC Logistics Changelog",
                  "color": 0xD7B34A,
                  "hoist": False,
                  "mentionable": True,
                  "permissions": "0",
              })
              print("Created @BC Logistics Changelog role.")

          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          after = os.environ["GITHUB_SHA"]
          zero_sha = "0" * 40
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          head_message = os.environ.get("GITHUB_EVENT_HEAD_COMMIT_MESSAGE", "").strip()
          is_backfill = event_name == "workflow_dispatch" or head_message.startswith(("changelog: backfill full history", "changelog: backfill embeds full history", "changelog: consolidate history into one Discord post"))
          if is_backfill:
              # One-time backfill: include every commit reachable from the selected main-branch SHA.
              revision_range = after
          elif before and before != zero_sha and event_name == "push":
              # Normal updates include only commits introduced by this push.
              revision_range = f"{before}..{after}"
          else:
              revision_range = after

          log_format = "%cs%x1f%s"
          raw_log = subprocess.check_output(
              ["git", "log", "--format=" + log_format, revision_range],
              text=True,
          ).strip()

          entries = []
          for record in raw_log.splitlines():
              if not record:
                  continue
              date, subject = record.split("\x1f", 1)
              subject = " ".join(subject.split())
              entries.append(f"- **{date}** — {subject}")

          if not entries:
              entries = [f"- **Update** — Company changes published in commit {after[:7]}"]

          heading = "🏆 BC GOLD LOGISTICS CHANGELOG"
          role_mention = f"<@&{role['id']}>"

          # Discord limits embed text, so publish the complete history as one text attachment
          # on a single gold embed message. This avoids splitting the history into many posts.
          changelog_text = "\n".join(entries) + "\n"
          preview = "\n".join(entries[:2])
          if len(entries) > 2:
              preview += "\n…"
          if entries:
              preview += "\n" + entries[-1]
          description = f"{len(entries)} dated changes\n{preview}"

          recent_messages = api("GET", f"/channels/{channel['id']}/messages?limit=100")
          signature = (heading, description)
          already_present = any(
              (embed.get("title", ""), embed.get("description", "")) == signature
              for item in recent_messages
              for embed in item.get("embeds", [])
          )

          published = 0
          skipped = 0
          if already_present:
              skipped = 1
          else:
              embed = {
                  "title": heading,
                  "description": description,
                  "color": 0xD7B34A,
              }
              boundary = "----BCGoldLogisticsChangelogBoundary"
              payload = {
                  "content": role_mention,
                  "embeds": [embed],
                  "allowed_mentions": {"parse": [], "roles": [role["id"]]},
              }
              parts = [
                  f"--{boundary}\r\n"
                  'Content-Disposition: form-data; name="payload_json"\r\n'
                  "Content-Type: application/json\r\n\r\n"
                  + json.dumps(payload)
                  + "\r\n",
                  f"--{boundary}\r\n"
                  'Content-Disposition: form-data; name="files[0]"; filename="bc-gold-logistics-changelog.txt"\r\n'
                  "Content-Type: text/plain; charset=utf-8\r\n\r\n",
              ]
              body = "".join(parts).encode("utf-8") + changelog_text.encode("utf-8") + f"\r\n--{boundary}--\r\n".encode()
              request = urllib.request.Request(
                  base + f"/channels/{channel['id']}/messages",
                  data=body,
                  headers={
                      "Authorization": f"Bot {token}",
                      "Content-Type": f"multipart/form-data; boundary={boundary}",
                      "User-Agent": "BC-Gold-Logistics-Changelog/2.0",
                  },
                  method="POST",
              )
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          response.read()
                      published = 1
                      break
                  except urllib.error.HTTPError as error:
                      detail = error.read().decode("utf-8", errors="replace")
                      if error.code == 429 and attempt < 5:
                          try:
                              wait = float(json.loads(detail).get("retry_after", 1))
                          except (ValueError, TypeError):
                              wait = 1
                          time.sleep(max(wait, 1) + 0.25)
                          continue
                      raise RuntimeError(
                          f"Discord API POST message returned HTTP {error.code}: {detail[:600]}"
                      ) from None

          print(f"Processed {len(entries)} dated commit entries in one message: published {published}, skipped {skipped} already-present message(s).")
          print(f"Processed {len(entries)} dated commit entries across {total} message(s): published {published}, skipped {skipped} already-present message(s).")
          PY
