name: BC Gold Logistics Discord changelog
# Rebuild the complete Discord archive as gold embeds on this commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish detailed company changelog to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          guild_id = os.environ.get("DISCORD_GUILD_ID", "").strip()
          if not token or not guild_id:
              raise SystemExit("Missing DISCORD_BOT_TOKEN or DISCORD_GUILD_ID repository secret.")

          base = "https://discord.com/api/v10"
          headers = {
              "Authorization": f"Bot {token}",
              "Content-Type": "application/json",
              "User-Agent": "BC-Gold-Logistics-Changelog/2.0",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as error:
                      detail = error.read().decode("utf-8", errors="replace")
                      if error.code == 429 and attempt < 5:
                          try:
                              wait = float(json.loads(detail).get("retry_after", 1))
                          except (ValueError, TypeError):
                              wait = 1
                          time.sleep(max(wait, 1) + 0.25)
                          continue
                      raise RuntimeError(
                          f"Discord API {method} {path} returned HTTP {error.code}: {detail[:600]}"
                      ) from None

          guild_path = f"/guilds/{guild_id}"
          channels = api("GET", guild_path + "/channels")
          channel = next(
              (item for item in channels if item.get("type") == 0 and item.get("name") == "bc-logistics-changelog"),
              None,
          )
          if channel is None:
              channel = api("POST", guild_path + "/channels", {
                  "name": "bc-logistics-changelog",
                  "type": 0,
                  "topic": "Automatic dated release notes for BC Gold Logistics website, company systems, features, fixes, and integrations.",
                  "permission_overwrites": [],
              })
              print("Created #bc-logistics-changelog.")

          roles = api("GET", guild_path + "/roles")
          role = next(
              (item for item in roles if item.get("name", "").casefold() == "bc logistics changelog"),
              None,
          )
          if role is None:
              role = api("POST", guild_path + "/roles", {
                  "name": "BC Logistics Changelog",
                  "color": 0xD7B34A,
                  "hoist": False,
                  "mentionable": True,
                  "permissions": "0",
              })
              print("Created @BC Logistics Changelog role.")

          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          after = os.environ["GITHUB_SHA"]
          zero_sha = "0" * 40
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          head_message = os.environ.get("GITHUB_EVENT_HEAD_COMMIT_MESSAGE", "").strip()
          is_reset = event_name == "push" and head_message.startswith(("changelog: reset channel and rebuild from top", "changelog: publish complete history as plain text", "changelog: rebuild complete history as gold embeds"))
          is_backfill = is_reset or event_name == "workflow_dispatch" or head_message.startswith(("changelog: backfill full history", "changelog: backfill embeds full history", "changelog: consolidate history into one Discord post", "changelog: backfill consolidated history", "changelog: fix single-post completion"))

          if is_reset:
              print("Reset requested: clearing every existing message in #bc-logistics-changelog.")
              deleted = 0
              while True:
                  batch = api("GET", f"/channels/{channel['id']}/messages?limit=100")
                  if not batch:
                      break
                  for message in batch:
                      api("DELETE", f"/channels/{channel['id']}/messages/{message['id']}")
                      deleted += 1
                  print(f"Deleted {deleted} old changelog messages.")
              print(f"Channel reset complete: deleted {deleted} messages.")
          if is_backfill:
              # One-time backfill: include every commit reachable from the selected main-branch SHA.
              revision_range = after
          elif before and before != zero_sha and event_name == "push":
              # Normal updates include only commits introduced by this push.
              revision_range = f"{before}..{after}"
          else:
              revision_range = after

          log_format = "%cs%x1f%s"
          raw_log = subprocess.check_output(
              ["git", "log", "--reverse", "--format=" + log_format, revision_range],
              text=True,
          ).strip()

          entries = []
          for record in raw_log.splitlines():
              if not record:
                  continue
              date, subject = record.split("\x1f", 1)
              subject = " ".join(subject.split())
              entries.append(f"{date} — {subject}")

          if not entries:
              entries = [f"Update — Company changes published in commit {after[:7]}"]

          heading = "🏆 BC GOLD LOGISTICS — OFFICIAL CHANGELOG"

          # Publish one Discord message per update. Discord limits an embed description
          # to 4,096 characters, so very large histories are compacted into one post.
          # Keep oldest and newest entries, with an explicit omission marker if needed.
          max_description = 3900
          lines = entries[:]
          description = "\\n".join(lines)
          if len(description) > max_description:
              marker_template = "\\n… {omitted} older/middle entries omitted to fit Discord's single-post limit …\\n"
              kept = []
              left = 0
              right = len(lines) - 1
              while left <= right:
                  omitted = max(0, len(lines) - len(kept) - 1)
                  marker = marker_template.format(omitted=omitted)
                  candidate_left = "\\n".join(kept + [lines[left]])
                  candidate_right = "\\n".join([lines[right]] + kept[::-1])
                  if len(candidate_left) + len(candidate_right) + len(marker) + 1 > max_description:
                      break
                  kept.append(lines[left])
                  left += 1
                  if left <= right and len("\\n".join(kept + [lines[right]])) + len(marker) <= max_description:
                      kept.append(lines[right])
                      right -= 1
              if kept:
                  left_count = (len(kept) + 1) // 2
                  right_count = len(kept) // 2
                  first = lines[:left_count]
                  last = lines[len(lines)-right_count:] if right_count else []
                  omitted_count = len(lines) - len(first) - len(last)
                  description = "\\n".join(first + [marker_template.format(omitted=omitted_count).strip()] + last)
              else:
                  description = lines[-1][:max_description]

          embed = {
              "title": heading,
              "description": description[:4096],
              "color": 0xD7B34A,
              "footer": {
                  "text": f"Official company updates • {len(entries)} dated entries • Oldest to newest"
              },
          }
          payload = {
              "content": f"<@&{role['id']}> \\n",
              "embeds": [embed],
              "allowed_mentions": {"parse": [], "roles": [role["id"]]},
          }
          api("POST", f"/channels/{channel['id']}/messages", payload)
          published = 1

          print(
              f"Published {published} gold embed message(s) containing "
              f"{len(entries)} dated changelog entries, oldest to newest. "
              f"Role tagged once: {role['name']}."
          )
          PY
