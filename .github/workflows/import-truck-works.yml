name: Import BC Truck Works repositories

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-truck-works.yml

permissions:
  contents: write

concurrency:
  group: monorepo-foundation-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: monorepo-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import source repositories
        run: |
          command -v git
          git subtree -h >/dev/null 2>&1 || true
          bash scripts/migrate-monorepo.sh
        env:
          GITHUB_REF_NAME: monorepo-foundation

      - name: Push imported history to foundation branch
        run: git push origin HEAD:monorepo-foundation
