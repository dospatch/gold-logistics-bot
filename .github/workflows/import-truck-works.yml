name: Import BC Truck Works repositories

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monorepo-foundation-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/monorepo-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4
        with:
          ref: monorepo-foundation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Git subtree is available
        run: git subtree --version

      - name: Import source repositories
        run: bash scripts/migrate-monorepo.sh
        env:
          GITHUB_REF_NAME: monorepo-foundation

      - name: Push imported history to foundation branch
        run: git push origin HEAD:monorepo-foundation
