name: Monorepo app validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'apps/**'
      - '.github/workflows/monorepo-validation.yml'
  push:
    branches: [main, monorepo-foundation, truck-works-unified]
    paths:
      - 'src/**'
      - 'package.json'
      - 'apps/**'
      - '.github/workflows/monorepo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate independent apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gold-logistics-root
            directory: .
            node: '22'
            command: 'node --check src/index.js'
          - app: bc-truck-works-platform
            directory: apps/bc-truck-works/platform
            node: '22'
            command: 'node --check index.js'
          - app: bc-truck-works-live
            directory: apps/bc-truck-works/live-companion
            node: '22'
            command: 'npm run build'
          - app: bc-truck-works-discord
            directory: apps/bc-truck-works/discord-bot
            node: '22'
            command: 'node --check index.js'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm install --no-audit --no-fund
      - name: Validate app
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
