services:
  - type: web
    name: bc-gold-logistics-bot
    branch: main
    autoDeployTrigger: commit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        value: "1566494800897769492"
      - key: GUILD_ID
        sync: false
